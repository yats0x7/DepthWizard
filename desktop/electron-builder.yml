appId: in.sih.depthwizard
productName: DepthWizard
directories:
  output: release
files:
  - src/**
  - package.json
extraResources:
  # Built web app, served by the API sidecar.
  - from: ../frontend/dist
    to: web
  # Optional frozen API (PyInstaller). When absent, the app falls back to `uv run depthwizard serve`.
  - from: ../backend/dist/depthwizard-api
    to: api
    filter: ["**/*"]
mac:
  category: public.app-category.developer-tools
  target: [dmg, zip]
  icon: build/icon.png
win:
  target: [nsis, portable]
  icon: build/icon.png
linux:
  target: [AppImage, deb]
  icon: build/icon.png
  category: Science
