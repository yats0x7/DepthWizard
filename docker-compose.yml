services:
  depthwizard:
    build:
      context: .
      dockerfile: docker/engine.Dockerfile
    image: depthwizard:latest
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - depthwizard-data:/data
      - hf-cache:/data/hf
    environment:
      DW_MODEL: small
      DW_DEM_SOURCE: terrarium
      DW_DEVICE: auto
    restart: unless-stopped

volumes:
  depthwizard-data:
  hf-cache:
