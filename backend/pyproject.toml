[project]
name = "depthwizard"
version = "0.1.0"
description = "Single-view satellite height estimation and 3D flythrough (SIH 2026, PS 26175, ISRO)"
readme = "README.md"
requires-python = ">=3.12,<3.14"
license = "MIT"
dependencies = [
  "numpy>=2.0",
  "scipy>=1.13",
  "pillow>=10",
  "rasterio>=1.4",
  "pyproj>=3.6",
  "torch>=2.4",
  "transformers>=4.45",
  "huggingface-hub>=0.25",
  "trimesh>=4.4",
  "dem-stitcher>=2.5",
  "scikit-learn>=1.5",
  "scikit-image>=0.24",
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "python-multipart>=0.0.9",
  "pydantic>=2.8",
  "pydantic-settings>=2.4",
  "typer>=0.12",
  "rich>=13",
  "opencv-python-headless>=4.10",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-cov>=5", "httpx>=0.27", "ruff>=0.6", "mypy>=1.11"]

[project.scripts]
depthwizard = "depthwizard.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["depthwizard"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "W"]
ignore = ["B008", "E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
