[project]
name = "depthwizard"
version = "1.0.0"
description = "Single-image satellite / aerial imagery to DSM engine with 3D flythrough outputs"
readme = "README.md"
requires-python = ">=3.12,<3.14"
dependencies = [
  "numpy>=2.0",
  "scipy>=1.14",
  "pillow>=10.4",
  "rasterio>=1.4",
  "pyproj>=3.7",
  "torch>=2.4",
  "torchvision>=0.19",
  "transformers>=4.45",
  "huggingface-hub>=0.25",
  "trimesh>=4.4",
  "dem-stitcher>=2.5",
  "scikit-learn>=1.5",
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "python-multipart>=0.0.12",
  "pydantic>=2.9",
  "pydantic-settings>=2.5",
  "typer>=0.12",
  "rich>=13.8",
  "opencv-python-headless>=4.10",
  "requests>=2.32",
  "certifi>=2024.8",
  "sse-starlette>=2.1",
]

[project.optional-dependencies]
dev = ["pytest>=8.3", "pytest-cov>=5.0", "httpx>=0.27", "ruff>=0.6", "mypy>=1.11"]

[project.scripts]
depthwizard = "depthwizard.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["depthwizard"]

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "W"]
ignore = ["B008", "E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]
